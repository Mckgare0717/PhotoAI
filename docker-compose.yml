services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: photoai
      POSTGRES_PASSWORD: photoai
      POSTGRES_DB: photoai
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoai"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build: ./ml-service
    environment:
      DET_SIZE: "960"
    ports:
      - "8000:8000"

  web:
    build: ./web
    environment:
      DATABASE_URL: postgres://photoai:photoai@db:5432/photoai
      ML_SERVICE_URL: http://ml-service:8000
      STORAGE_DIR: /data/storage
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      NEXT_PUBLIC_BASE_URL: ${BASE_URL:-http://localhost:3000}
    volumes:
      - photo-storage:/data/storage
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started

volumes:
  db-data:
  photo-storage:
